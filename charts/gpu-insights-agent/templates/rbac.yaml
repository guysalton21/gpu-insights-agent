apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-insights-agent.fullname" . }}-read
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpu-insights-agent.fullname" . }}-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpu-insights-agent.fullname" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-insights-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.alerting.apply.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gpu-insights-agent.fullname" . }}-alerts
  namespace: {{ .Values.alerting.namespace }}
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gpu-insights-agent.fullname" . }}-alerts
  namespace: {{ .Values.alerting.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gpu-insights-agent.fullname" . }}-alerts
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-insights-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

