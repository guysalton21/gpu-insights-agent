[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-insights-agent"
version = "0.1.0"
description = "A Kubernetes-native GPU usage assistant for NVIDIA DCGM, Prometheus, and GPU Usage Monitor."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NVIDIA GPU Insights Agent contributors" }]
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]
test = []

[project.scripts]
gpu-insights-agent = "gpu_insights_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

